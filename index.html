<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>The Guild of Second Chances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one column for a player's phone, a card grid for the DM's laptop. Ink, verdigris and brass, like an old campaign map. */
:root{
  --bg:#E8ECE5; --surface:#F7F8F3; --sunk:#DCE2D9; --fg:#1C2230; --muted:#586170; --line:#C3CBC0;
  --accent:#2B7262; --accent-ink:#F7F8F3; --brass:#946A1C; --blood:#AE3338; --ok:#3A7C43; --warn:#9C6D12;
  --display:"IM Fell English SC","Iowan Old Style",Georgia,serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141B; --surface:#192029; --sunk:#222A35; --fg:#E6E3D8; --muted:#9AA2AE; --line:#2E3744;
  --accent:#5DB59F; --accent-ink:#0D1916; --brass:#D2A54A; --blood:#E2686D; --ok:#7CC387; --warn:#DFB459; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141B; --surface:#192029; --sunk:#222A35; --fg:#E6E3D8; --muted:#9AA2AE; --line:#2E3744;
  --accent:#5DB59F; --accent-ink:#0D1916; --brass:#D2A54A; --blood:#E2686D; --ok:#7CC387; --warn:#DFB459; color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.45rem;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.role{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.82rem;background:var(--surface)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.bad{border-color:var(--blood);color:var(--blood)}
.tabs{max-width:1180px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:8px 16px 0;scrollbar-width:none}
.tabs button{border:0;background:none;padding:8px 12px 10px;border-bottom:3px solid transparent;font-weight:700;color:var(--muted);white-space:nowrap;cursor:pointer}
.tabs button[aria-current="true"]{color:var(--fg);border-color:var(--brass)}
.banner{margin:14px 0 0;padding:10px 14px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:.92rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{color:var(--blood);border-color:var(--blood)}
.btn.sm{min-height:32px;padding:0 10px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
textarea{min-height:76px;resize:vertical}
label.f{display:grid;gap:4px;font-weight:700;font-size:.92rem}
label.f span.h{font-weight:400;color:var(--muted);font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
section.view{display:grid;gap:18px;padding-top:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.muted{color:var(--muted)}
.empty{padding:28px 18px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.empty h2{color:var(--fg);font-size:1.4rem;margin-bottom:6px}

/* hp */
.hpbar{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden;position:relative}
.hpbar i{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:6px}
.hpbar i.mid{background:var(--warn)} .hpbar i.low{background:var(--blood)}
.hpbar b{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.45}

/* party cards */
.pc{display:grid;gap:10px}
.pc .top{display:flex;gap:12px;align-items:flex-start}
.crest{flex:none;width:44px;height:50px;display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;color:var(--accent-ink);background:var(--accent);clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}
.pc h3{font-size:1.3rem;line-height:1.1}
.sub{font-size:.88rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.stat{background:var(--sunk);border-radius:8px;padding:6px 2px}
.stat b{display:block;font-family:var(--mono);font-size:1.05rem}
.stat span{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hpline{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hpline .big{font-family:var(--mono);font-size:1.4rem;font-weight:600}
.down{color:var(--blood);font-weight:800}
.lastroll{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.lastroll b{color:var(--fg);font-family:var(--mono)}

/* sheet */
.sheet{display:grid;gap:14px}
.sheet h2{font-size:1.9rem;line-height:1.05}
.sgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:760px){.sgrid{grid-template-columns:1fr 1fr}}
.abil{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:520px){.abil{grid-template-columns:repeat(6,1fr)}}
.ab{border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:center;padding:8px 4px 6px;cursor:pointer}
.ab .k{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ab .m{font-family:var(--mono);font-size:1.5rem;font-weight:600;line-height:1.2}
.ab .s{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.ab .sv{display:block;margin-top:4px;font-size:.74rem;border-top:1px dashed var(--line);padding-top:4px}
.ab .sv.p{color:var(--accent);font-weight:700}
.list{display:grid;gap:2px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;background:none;border:0;text-align:left;width:100%;cursor:pointer}
button.li:hover{background:var(--sunk)}
.li .num{font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;border:1px solid var(--muted);display:inline-block;margin-right:8px;vertical-align:middle}
.dot.p{background:var(--accent);border-color:var(--accent)}
.skills{display:grid;grid-template-columns:1fr;gap:0 12px}
@media (min-width:420px){.skills{grid-template-columns:1fr 1fr}}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);background:none;cursor:pointer}
.pip.used{background:var(--sunk);border-color:var(--line)}
.pip.mark{background:var(--accent)} .pip.markf{background:var(--blood)}
.feat summary{cursor:pointer;font-weight:700;padding:6px 0}
.feat p{margin:0 0 8px;color:var(--muted);font-size:.92rem}
.inv{display:grid;gap:6px}
.inv .it{display:flex;gap:8px;align-items:center}
.inv .it span{flex:1;min-width:0}
.qty{width:64px!important}
.k2{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.94rem}
.k2 dt{color:var(--muted)} .k2 dd{margin:0}
.secret{border-left:3px solid var(--brass);padding-left:10px}

/* builder */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:.78rem;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps span.now{border-color:var(--brass);color:var(--fg);font-weight:700}
.steps span.done{color:var(--accent);border-color:var(--accent)}
.choices{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.choice{text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;cursor:pointer;display:grid;gap:4px}
.choice h3{font-size:1.25rem}
.choice p{margin:0;font-size:.9rem;color:var(--muted)}
.choice .tags{font-size:.78rem;color:var(--brass);font-weight:700;letter-spacing:.04em}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.arr{display:grid;gap:6px}
.arr button{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.arr button.sel{border-color:var(--brass);box-shadow:inset 0 0 0 2px var(--brass)}
.arr .tot{font-family:var(--mono);font-weight:600;font-size:1.15rem;min-width:2ch;text-align:right}
.navbar{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px;justify-content:space-between}

/* encounter */
.init{display:grid;gap:6px}
.cb{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.cb.now{border-color:var(--brass);box-shadow:inset 4px 0 0 var(--brass)}
.cb.npc .nm{color:var(--blood)}
.cb .nm{font-weight:800}
.cb input{min-height:34px;padding:4px 6px;text-align:center}
.cb .side{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.state{font-size:.8rem;font-weight:700}
.scene h2{font-size:1.7rem}
.scene p{white-space:pre-wrap;max-width:65ch;margin:.4em 0 0;font-size:1.05rem}
.log{display:grid;gap:6px;font-size:.94rem}
.log div{border-left:2px solid var(--line);padding-left:10px}
.guide{max-width:72ch}
.guide h3{font-size:1.3rem;margin-top:8px}
.guide p,.guide li{color:var(--fg)}
.guide table{border-collapse:collapse;width:100%;font-size:.94rem}
.guide td,.guide th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}

/* overlay + dice */
.ov{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 0 40px}
.ov .card{max-width:980px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;margin-inline:12px}
@media (min-width:1010px){.ov .card{margin-inline:auto}}
.ovhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:62px;height:62px;border-radius:50%;border:0;background:var(--brass);color:var(--bg);font-family:var(--display);font-size:1.3rem;box-shadow:0 6px 18px rgb(0 0 0 / .25);cursor:pointer}
.tray{position:fixed;right:12px;left:12px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:31;max-width:380px;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;box-shadow:0 10px 30px rgb(0 0 0 / .25)}
.dice{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dice button{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-family:var(--mono);font-weight:600;cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 4px;font-weight:700;font-size:.86rem;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.result{font-family:var(--mono);font-size:2.4rem;font-weight:600;line-height:1}
.hist{font-size:.82rem;color:var(--muted);max-height:120px;overflow:auto;display:grid;gap:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:min(92vw,520px);font-weight:500;box-shadow:0 8px 24px rgb(0 0 0 / .25)}
.toast b{font-family:var(--mono);font-size:1.2rem}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
<style>
/* Tarot direction: a deliberate single dark look, navy card stock with gold leaf. */
:root,:root:not([data-theme="light"]),:root[data-theme="dark"],:root[data-theme="light"]{--bg:#0E1630;--surface:#15224A;--sunk:#1B2B58;--fg:#ECE4CF;--muted:#9EA8C8;--line:#33467C;--accent:#D9B45B;--accent-ink:#0E1630;--brass:#D9B45B;--blood:#E8837A;--ok:#8FC79A;--warn:#E3B95E;--display:"Cinzel",Georgia,serif;--body:"Spectral",Georgia,serif;color-scheme:dark}
h1,h2,h3{letter-spacing:.04em}
.brand{font-size:1.05rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.brand small{letter-spacing:.2em;font-family:var(--display)}
.btn{font-family:var(--display);letter-spacing:.08em;font-size:.88rem}
.btn.pri{border-radius:999px}
.choice{background:linear-gradient(var(--surface),var(--bg));border-color:var(--line)}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent),0 0 18px rgb(217 180 91 / .2)}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.tcard{aspect-ratio:2/3.2;border:1px solid var(--accent);border-radius:9px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;background:linear-gradient(#18285A,#0E1630);position:relative;cursor:pointer;color:var(--fg)}
.tcard:before{content:"";position:absolute;inset:4px;border:1px solid rgb(217 180 91 / .35);border-radius:6px;pointer-events:none}
.tcard[aria-pressed="true"]{background:linear-gradient(#2C3F78,#18285A);box-shadow:0 0 0 2px var(--accent),0 0 24px rgb(217 180 91 / .35)}
.tcard .tn{font-family:var(--display);font-size:.66rem;color:var(--accent);letter-spacing:.12em}
.tcard b{font-family:var(--display);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;line-height:1.2}
.tcard svg.sig{width:44px;height:44px;color:var(--accent)}
.glyph{width:46px;height:46px;border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.35rem;color:var(--accent)}
.tdesc{border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:center;background:var(--surface)}
.tdesc p{margin:.2em 0;font-style:italic;font-size:1.02rem}
.tdesc .tags{font-family:var(--display);font-size:.72rem;letter-spacing:.1em;color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.tcard{transition:transform .15s ease}.tcard[aria-pressed="true"]{transform:translateY(-3px)}}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
.who{display:grid;gap:4px}
.prow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.prow h3{font-size:1.25rem}
.link{font-family:var(--mono);font-size:.78rem;word-break:break-all;color:var(--muted)}
.tip{border-left:3px solid var(--brass);padding:4px 0 4px 10px;color:var(--muted);font-size:.92rem}
.ab{cursor:default}
.li{cursor:default}
header.top,main.wrap,.navbar{position:relative;z-index:2}
header.top{position:sticky}
.corners .cn{position:fixed;width:min(30vw,220px);aspect-ratio:1;color:var(--accent);opacity:.08;z-index:1;pointer-events:none}
.corners .cn svg{width:100%;height:100%;display:block}
.cn.tl{top:0;left:0}.cn.tr{top:0;right:0;transform:scaleX(-1)}.cn.bl{bottom:0;left:0;transform:scaleY(-1)}.cn.br{bottom:0;right:0;transform:scale(-1,-1)}
.fx{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.fx canvas{position:absolute;inset:0;width:100%;height:100%}
.fx>div,.fx .web{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
.fx-glow{background:radial-gradient(120% 90% at 50% 110%,rgb(255 170 70 / .22),transparent 60%),radial-gradient(80% 60% at 50% -10%,rgb(255 190 110 / .08),transparent 70%)}
.fx-fog{background:radial-gradient(60% 30% at 20% 80%,rgb(200 210 230 / .14),transparent 70%),radial-gradient(60% 30% at 80% 60%,rgb(200 210 230 / .12),transparent 70%),radial-gradient(70% 35% at 50% 100%,rgb(200 210 230 / .18),transparent 70%);background-size:200% 100%}
.fx-flash{background:rgb(220 230 255 / .9)}
.fx .web{inset:auto;width:min(40vw,260px);aspect-ratio:1;color:#C9CED8}
.fx .web svg{width:100%;height:100%}
.web.wl{top:0;left:0}.web.wr{top:0;right:0;transform:scaleX(-1)}
body[data-mood="tavern"] .fx-glow{opacity:1}
body[data-mood="cellar"] .web{opacity:.22}
body[data-mood="cellar"] .fx-glow{opacity:.35;filter:hue-rotate(-20deg)}
body[data-mood="fog"] .fx-fog,body[data-mood="cellar"] .fx-fog{opacity:1}
body[data-mood="storm"] .fx-fog{opacity:.5}
@media (prefers-reduced-motion:no-preference){
 body[data-mood="tavern"] .fx-glow{animation:flicker 3.2s infinite alternate ease-in-out}
 @keyframes flicker{0%{opacity:.85}20%{opacity:1}35%{opacity:.78}60%{opacity:.95}80%{opacity:.82}100%{opacity:1}}
 body[data-mood="fog"] .fx-fog,body[data-mood="cellar"] .fx-fog,body[data-mood="storm"] .fx-fog{animation:drift 40s linear infinite alternate}
 @keyframes drift{from{background-position:0 0}to{background-position:-100% 0}}
 .fx-flash.go{animation:flash 1.1s ease-out}
 @keyframes flash{0%{opacity:0}4%{opacity:.75}8%{opacity:.05}12%{opacity:.5}40%{opacity:0}}
}
.moods{display:flex;gap:6px;flex-wrap:wrap}
header.top{background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.panel.scene{background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(2px)}
.fx .fx-fog{left:-50%;right:-50%;background-size:auto}
@media (prefers-reduced-motion:no-preference){body[data-mood="fog"] .fx-fog,body[data-mood="cellar"] .fx-fog,body[data-mood="storm"] .fx-fog{animation:drift2 38s ease-in-out infinite alternate}@keyframes drift2{from{transform:translateX(-18%)}to{transform:translateX(18%)}}}
.mon .art{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:cover;border-radius:7px}
.mon.has-art:after{content:"";position:absolute;inset:4px;border-radius:7px;background:linear-gradient(rgb(20 14 30 / .55),transparent 30%,transparent 62%,rgb(20 14 30 / .85))}
.mon>*:not(.art){position:relative;z-index:1}
.portrait{max-width:300px;width:100%;margin:0 auto;border:1px solid var(--accent);border-radius:14px;padding:6px;background:var(--surface);box-shadow:0 0 34px rgb(217 180 91 / .25)}
.portrait img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:9px;display:block}

.thumb{width:44px;height:66px;object-fit:cover;border-radius:6px;border:1px solid var(--accent);flex:none}

/* ---------- derived character ---------- */
function derive(c){
  const A=ANC[c.ancestry]||ANC.human,K=CLS[c.cls]||CLS.fighter,B=BG[c.background]||{skills:[]};
  const lvl=Math.min(5,Math.max(1,c.level||1)),prof=lvl>=5?3:2;
  const sc={},m={};
  AB.forEach(a=>{sc[a]=((c.base&&c.base[a])||10)+(A.bonus[a]||0)+((c.boost&&c.boost[a])||0);m[a]=md(sc[a])});
  const ps=new Set([...(B.skills||[]),...(A.skills||[]),...(c.skills||[])]);
  const skills=Object.entries(SK).map(([s,a])=>({s,a,p:ps.has(s),v:m[a]+(ps.has(s)?prof:0)}));
  const saves={};AB.forEach(a=>{const p=K.saves.includes(a);saves[a]={p,v:m[a]+(p?prof:0)}});
  const avg=K.die/2+1;
  const hpMax=Math.max(1,K.die+m.con+(lvl-1)*(avg+m.con)+(c.ancestry==='dwarf'?lvl:0)+(+c.hpBonus||0));
  const ac=K.ac(m)+(+c.acBonus||0);
  const attacks=K.attacks.map(w=>({n:w.n,hit:m[w.ab]+prof,d:w.d+kmod(m[w.ab]),t:w.t}));
  if(c.cls==='rogue')attacks.push({n:'Sneak attack (extra)',hit:null,d:Math.ceil(lvl/2)+'d6',t:'added once per turn'});
  let cast=null;
  if(K.cast){const cm=m[K.cast.ab];const slots=(K.cast.full?SLOTS_FULL:SLOTS_HALF)[lvl]||[];
    cast={ab:K.cast.ab,mod:cm,dc:8+prof+cm,atk:prof+cm,slots,cantrips:[...new Set([...(c.ancestry==='tiefling'?['Thaumaturgy']:[]),...(c.cantrips||[])])],spells:[...(K.cast.always||[]),...(c.spells||[])]}}
  else if(c.ancestry==='tiefling'){cast={ab:'cha',mod:m.cha,dc:8+prof+m.cha,atk:prof+m.cha,slots:[],cantrips:['Thaumaturgy'],spells:[]}}
  const res=[...(K.res||[]),...(A.res||[])].map(r=>({...r,max:r.max(lvl,m)})).filter(r=>r.max>0);
  const feats=[...K.features.filter(f=>f[0]<=lvl).map(f=>[f[1],f[2]]),...A.traits];
  if(B.feat)feats.push([B.name+' background',B.feat]);
  const pp=10+skills.find(x=>x.s==='Perception').v;
  const breathDC=8+m.con+prof;
  return {A,K,B,lvl,prof,sc,m,skills,saves,hpMax,ac,init:m.dex,speed:A.speed,attacks,cast,res,feats,pp,breathDC};
}
function hpState(hp,max){if(hp<=0)return['Down','down'];const r=hp/max;if(r<=.5)return['Bloodied','low'];if(r<1)return['Hurt','mid'];return['Unhurt','']}

async function rpc(fn,args){
  const r=await fetch(CFG.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:Object.assign({'apikey':CFG.key,'Content-Type':'application/json'},CFG.key.startsWith('sb_')?{}:{'Authorization':'Bearer '+CFG.key}),body:JSON.stringify(args||{})});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){const m=(j&&(j.message||j.hint))||('HTTP '+r.status);const e=new Error(m);e.status=r.status;throw e}
  return j;
}

const STEPS=[['who','Name'],['anc','Ancestry'],['cls','Class'],['abil','Abilities'],['skills','Skills'],['spells','Spells'],['story','Story'],['done','Review']];
function steps(){const k=CLS[S.draft.cls];return STEPS.filter(s=>s[0]!=='spells'||(k&&k.cast&&(k.cast.cantrips||k.cast.spells)))}
function stepOk(key){const D=S.draft;const K=CLS[D.cls];
  if(key==='who')return!!D.name.trim();if(key==='anc')return!!D.ancestry;if(key==='cls')return!!D.cls;
  if(key==='skills')return!!D.background&&D.skills.length===K.pick;
  if(key==='spells')return D.cantrips.length===K.cast.cantrips&&D.spells.length===K.cast.spells;if(key==='story')return!!D.avail;return true}
const ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X'];

  return `<div class="deck">${entries.map(([k,o],i)=>`<button class="tcard" data-act="pick" data-f="${field}" data-v="${k}" aria-pressed="${sel===k}"><span class="tn">${ROMAN[i]}</span>${field==='cls'?`<svg class="sig"><use href="#s-${SIG[k]}"/></svg>`:`<span class="glyph">${esc(o.name[0])}</span>`}<b>${esc(o.name)}</b></button>`).join('')}</div>`+desc;
}
function abHelp(a){return{str:'lifting, hitting, opening stubborn jars',dex:'reflexes, aim, sneaking out before breakfast',con:'toughness, hit points, hangover recovery',int:'memory, reasoning, wizard magic',wis:'gut feeling, cleric magic, knowing when to leave',cha:'charm, presence, free drinks, bard magic'}[a]}
function draftToChar(){const D=S.draft;return{name:D.name.trim(),ancestry:D.ancestry,cls:D.cls,background:D.background,base:{...D.base},skills:[...D.skills],cantrips:[...D.cantrips],spells:[...D.spells],look:D.look,personality:D.personality,drive:D.drive,tie:D.tie,never:D.never,likes:[...D.likes],avail:D.avail,away:D.away,level:1}}
function charToDraft(c,secret){return{...blankDraft(),...clone(c),secret:secret||''}}
function viewBuild(){
  const st=steps();if(S.step>=st.length)S.step=st.length-1;const [key]=st[S.step];const D=S.draft;
  const head=`<div style="display:grid;gap:10px"><span class="eyebrow">${ROMAN[S.step]} · ${st[S.step][1]}</span><div class="steps">${st.map((s,i)=>`<span class="${i===S.step?'now':i<S.step?'done':''}">${s[1]}</span>`).join('')}</div></div>`;
  let body='';
  if(key==='who')body=`<h2 style="font-size:1.8rem">Who are you playing?</h2><p class="muted" style="margin:0">Pick a name that sounds good shouted across a tavern, ideally by someone you owe money. You can change anything until the first session.</p>
    <label class="f">Character name<input type="text" id="b-name" data-draft="name" value="${esc(D.name)}" placeholder="Brannoc Ashfall" autocomplete="off"></label>`;
  if(key==='anc')body=`<h2 style="font-size:1.8rem">Draw your people</h2><p class="muted" style="margin:0">Your people. It shapes your body, your senses and what your mother says about you at weddings.</p>${tarot('ancestry',Object.entries(ANC),D.ancestry,a=>Object.entries(a.bonus).map(([b,v])=>ABS[b]+' +'+v).join(' · ')+(a.speed<30?' · speed '+a.speed:''))}`;
  if(key==='cls')body=`<h2 style="font-size:1.8rem">Draw your calling</h2><p class="muted" style="margin:0">What you do when things go wrong, which they will. New to this? Fighter and Barbarian are the simplest; Cleric and Bard keep everyone alive.</p>${tarot('cls',Object.entries(CLS),D.cls,c=>c.tags)}`;
  if(key==='abil'){const A=ANC[D.ancestry];
    body=`<h2 style="font-size:1.8rem">Set your abilities</h2><p class="muted" style="margin:0">We put your best numbers where a ${CLS[D.cls].name} needs them. Tap one ability and then another to swap them. Nobody is good at everything, especially at our age.</p>
    <div class="arr">${AB.map(a=>{const b=D.base[a],bon=A.bonus[a]||0,t=b+bon;return`<button data-act="swap" data-a="${a}" class="${S.swap===a?'sel':''}"><span><b>${ABN[a]}</b><br><span class="sub">${esc(abHelp(a))}</span></span><span class="num muted">${b}${bon?' +'+bon:''}</span><span class="tot">${t}</span><span class="num" style="min-width:3ch;text-align:right">${sg(md(t))}</span></button>`}).join('')}</div>
    <div><button class="btn sm" data-act="recommend">Use the recommended spread</button></div>`}
  if(key==='skills'){const K=CLS[D.cls];const B=BG[D.background];const fixed=new Set([...(B?B.skills:[]),...(ANC[D.ancestry].skills||[])]);
    body=`<h2 style="font-size:1.8rem">Background and skills</h2><p class="muted" style="margin:0">Your life before the guild took you in. It comes with two skills, some gear and at least one regret.</p>

  if(key==='spells'){const C=CLS[D.cls].cast;
    const grid=(list,f,n)=>`<div class="choices">${list.map(s=>{const on=D[f].includes(s);return`<button class="choice" data-act="spell" data-f="${f}" data-v="${esc(s)}" aria-pressed="${on}" ${!on&&D[f].length>=n?'disabled':''}><h3 style="font-size:1.1rem">${esc(s)}</h3><p>${esc(SPELLS[s].t)}</p></button>`}).join('')}</div>`;
    body=`<h2 style="font-size:1.8rem">Choose your magic</h2>${C.always?`<p class="muted" style="margin:0">You always have ${C.always.join(' and ')}.</p>`:''}
    <h3 style="font-size:1.35rem">Cantrips, free to cast all day, like compliments <span class="sub">(${D.cantrips.length} of ${C.cantrips})</span></h3>${grid(C.cl,'cantrips',C.cantrips)}

  if(key==='story')body=`<h2 style="font-size:1.8rem">Their story</h2><p class="muted" style="margin:0">A sentence each is plenty. The DM will use every word of it against you.</p>

    <label class="f">A secret only the DM sees <span class="h">Optional. The rest of the party never sees this.</span><textarea id="b-secret" data-draft="secret" placeholder="Still married. Technically.">${esc(D.secret)}</textarea></label>
    <div class="f">What do you, the player, enjoy most at the table? <span class="h">Pick any.</span><div class="row">${LIKES.map(l=>`<button class="chip ${D.likes.includes(l)?'on':''}" data-act="like" data-v="${esc(l)}">${esc(l)}</button>`).join('')}</div></div>
    <div class="f">How often can you join? <span class="h">Be honest, no judgement. The story is built around it, so dropping in and out is fine.</span><div class="choices">${Object.entries(AVAIL).map(([k,[t,h]])=>`<button class="choice" data-act="avail" data-v="${k}" aria-pressed="${D.avail===k}"><h3 style="font-size:1.1rem">${esc(t)}</h3><p>${esc(h)}</p></button>`).join('')}</div></div>
    ${D.avail&&D.avail!=='every'?`<div class="f">When you can't make it, your character is… <span class="h">Optional.</span><div class="row">${Object.entries(AWAY).map(([k,t])=>`<button class="chip ${D.away===k?'on':''}" data-act="away" data-v="${k}">${esc(t)}</button>`).join('')}</div></div>`:''}`;
  if(key==='done')body=`<h2 style="font-size:1.8rem">The guild will see you now, ${esc(D.name)}.</h2>
     <div class="row"><button class="btn pri" data-act="submit" id="submitbtn">${S.me&&S.me.data?'Save my changes':'Sign the guild ledger'}</button><button class="btn sm" data-act="restart">${S.armed==='restart'?'Tap again to start over':'Start over'}</button></div>

  return head+`<div style="display:grid;gap:14px">${body}</div>`+nav;

async function compressImage(file){const bmp=await createImageBitmap(file);const s=Math.min(1,900/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.82)}
async function syncArt(ids,dm){ids=[...new Set(ids.filter(Boolean))];if(!ids.length)return false;
  let idx;try{idx=dm?(await API.dmArtList(S.pass)).filter(a=>ids.includes(a.id)):await API.artIndex(ids)}catch(e){return false}
  let changed=false;const live=new Set(idx.map(a=>a.id));
  ids.forEach(i=>{if(!live.has(i)&&S.art[i]){delete S.art[i];changed=true}});
  const need=idx.filter(a=>!S.art[i2(a)]||S.art[a.id].v!==a.v).map(a=>a.id);
  function i2(a){return a.id}
  for(let i=0;i<need.length;i+=6){try{const got=await API.artGet(need.slice(i,i+6),dm?S.pass:null);got.forEach(g=>{if(S.art[g.id]&&!dm)S.artNew.add(g.id);if(!S.art[g.id]&&!dm)S.artNew.add(g.id);S.art[g.id]={v:g.v,data:g.data};changed=true})}catch(e){}}
  if(dm){idx.forEach(a=>{if(!S.artIdx[a.id]||S.artIdx[a.id].shown!==a.shown||S.artIdx[a.id].v!==a.v){S.artIdx[a.id]=a;changed=true}})}
  return changed}
function artImg(id,cls){const a=S.art[id];return a?`<img class="${cls||''}" src="${a.data}" alt="">`:''}
function monStatus(m){if(m.hp<=0)return'Down';const r=m.hp/m.max;if(r<=.5)return'Bloodied';if(r<1)return'Hurt';return'Unhurt'}
function pubFrom(d){return{scene:d.scene&&d.scene.title?{title:d.scene.title,text:d.scene.text,mood:d.scene.mood||''}:null,monsters:(d.monsters||[]).filter(m=>m.shown).map(m=>({k:m.k,name:m.name,status:monStatus(m),desc:m.desc||'',art:monArtId(m)})),log:(d.log||[]).slice(0,25)}}
/* ---------- live HP, conditions, slots ---------- */
function liveOf(c,l){const x=derive(c);l=l||{};const max=x.hpMax;return{x,max,hp:l.hp==null?max:Math.max(0,Math.min(max,+l.hp)),tmp:Math.max(0,+l.tmp||0),conds:l.conds||[],slots:l.slots||[],res:l.res||{}}}
function rawLive(L){return{hp:L.hp,tmp:L.tmp,conds:L.conds,slots:L.slots,res:L.res}}
function hpChange(L,d){if(d<0){let dmg=-d;const t=Math.min(L.tmp,dmg);L.tmp-=t;dmg-=t;L.hp=Math.max(0,L.hp-dmg)}else L.hp=Math.min(L.max,L.hp+d);
  if(L.hp<=0){if(!L.conds.includes('Unconscious'))L.conds=[...L.conds,'Unconscious']}else if(d>0)L.conds=L.conds.filter(c=>c!=='Unconscious')}
function hpLine(L){const[st,cl]=hpState(L.hp,L.max);return{st,cl,w:Math.round(100*L.hp/L.max)}}
function partyHTML(){const P=S.party||[];if(!P.length)return'';
  return`<div style="display:grid;gap:10px"><span class="eyebrow">The party</span><div class="party">${P.map(p=>{const L=liveOf(p.data,p.live),h=hpLine(L),pid='pc-'+p.id;
    return`<div class="pc ${L.hp<=0?'down':''}">${S.art[pid]?artImg(pid,'thumb'):`<span class="glyph">${esc((p.data.name||'?')[0])}</span>`}<div style="flex:1;min-width:0"><b>${esc(p.data.name)}</b><div class="hpbar"><i class="${h.cl}" style="width:${h.w}%"></i></div><div class="sub">${L.hp<=0?'<span class="down">Down</span>':L.hp+' / '+L.max+' HP'}${L.tmp?' · +'+L.tmp+' temp':''} · AC ${L.x.ac}</div>${L.conds.length?`<div class="row" style="gap:4px;margin-top:4px">${L.conds.map(c=>`<span class="chip bad" title="${esc(CONDS[c]||'')}">${esc(c)}</span>`).join('')}</div>`:''}</div></div>`}).join('')}</div></div>`}
function condCtl(id,L){return`<div class="row" style="gap:6px">${L.conds.map(c=>`<button class="chip bad" data-act="lcond" data-id="${esc(id)}" data-v="${esc(c)}" title="${esc(CONDS[c]||'')}">${esc(c)} ×</button>`).join('')}<select data-lcondadd="${esc(id)}" aria-label="Add a condition"><option value="">${L.conds.length?'Add another…':'Add a condition…'}</option>${Object.keys(CONDS).filter(c=>!L.conds.includes(c)).map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>`}
function hpCtl(id,big){return`<div class="row">${[-5,-1,1,5].map(n=>`<button class="btn sm" data-act="lhp" data-id="${esc(id)}" data-d="${n}">${n>0?'+'+n:'−'+Math.abs(n)}</button>`).join('')}<input type="number" inputmode="numeric" min="0" id="lamt-${esc(id)}" placeholder="${big?'amount':'amt'}" style="width:96px;min-height:32px" aria-label="Amount"><button class="btn sm warn" data-act="ldmg" data-id="${esc(id)}">${big?'Ouch':'Hit'}</button><button class="btn sm" data-act="lheal" data-id="${esc(id)}">Heal</button>${big?`<button class="btn sm" data-act="ltmp" data-id="${esc(id)}">Temp HP</button>`:''}</div>`}
function trackerHTML(c,live,id){const L=liveOf(c,live),h=hpLine(L),x=L.x;
  const slots=x.cast&&x.cast.slots.length?`<div class="f">Spell slots <span class="h">Tap one when you cast with it.</span>${x.cast.slots.map((n,i)=>`<div class="row" style="margin-top:4px"><span class="sub" style="width:64px">Level ${i+1}</span><div class="pips">${Array.from({length:n},(_,j)=>`<button class="pip ${j<(L.slots[i]||0)?'used':''}" data-act="lslot" data-id="${esc(id)}" data-i="${i}" data-j="${j}" aria-label="Level ${i+1} slot ${j+1}"></button>`).join('')}</div></div>`).join('')}</div>`:'';
  const res=x.res.length?`<div class="f">Once-per-rest powers${x.res.map(r=>`<div class="row" style="margin-top:4px"><span class="sub" style="min-width:64px">${esc(r.label)}</span><div class="pips">${Array.from({length:r.max},(_,j)=>`<button class="pip ${j<(L.res[r.key]||0)?'used':''}" data-act="lres" data-id="${esc(id)}" data-k="${esc(r.key)}" data-j="${j}" aria-label="${esc(r.label)} use ${j+1}"></button>`).join('')}</div></div>`).join('')}</div>`:'';
  return`<div class="panel track" style="display:grid;gap:10px"><div class="row" style="justify-content:space-between"><h3>Right now</h3><span class="chip ${L.hp<=0?'bad':''}">${h.st}</span></div>
   <div class="row" style="align-items:baseline"><span class="big num">${L.hp}</span><span class="muted">/ ${L.max} HP${L.tmp?' · +'+L.tmp+' temp':''} · AC ${x.ac}</span></div>
   <div class="hpbar"><i class="${h.cl}" style="width:${h.w}%"></i></div>${hpCtl(id,true)}
   <div class="f">Conditions ${condCtl(id,L)}</div>${slots}${res}
   <div class="row"><button class="btn sm" data-act="lrest" data-id="${esc(id)}" data-v="short">Short rest</button><button class="btn sm" data-act="lrest" data-id="${esc(id)}" data-v="long">${S.armed==='long'+id?'Tap again: full rest':'Long rest'}</button></div>
   <p class="sub" style="margin:0">The DM and the table see these numbers too. Lying about them is between you and your god.</p></div>`}
function dmPartyHTML(){const P=S.party||[];
  return`<div class="panel" style="display:grid;gap:10px"><div class="row" style="justify-content:space-between"><h3>The party</h3>${P.length?`<button class="btn sm" data-act="lrestall">${S.armed==='restall'?'Tap again':'Long rest for all'}</button>`:''}</div>
   ${P.length?P.map(p=>{const L=liveOf(p.data,p.live),h=hpLine(L);return`<div class="dpc"><div class="row" style="justify-content:space-between"><b>${esc(p.data.name)}</b><span class="muted">${L.hp<=0?'<span class="down">Down</span>':L.hp+' / '+L.max+' HP'}${L.tmp?' · +'+L.tmp+' temp':''} · AC ${L.x.ac}</span></div><div class="hpbar"><i class="${h.cl}" style="width:${h.w}%"></i></div>${hpCtl(p.id,false)}${condCtl(p.id,L)}</div>`}).join(''):'<p class="muted" style="margin:0">Characters appear here once players sign the ledger. Players can change their own HP too; you see it within a few seconds.</p>'}</div>`}
function viewTable(){
  const P=S.pub||{};const fresh=[];

  fresh.forEach(k=>S.seen.add(k));
  const sc=P.scene?`<div class="panel scene"><span class="eyebrow">Now</span><h2>${esc(P.scene.title)}</h2>${P.scene.text?`<p>${esc(P.scene.text)}</p>`:''}</div>`:`<div class="empty"><h2>The lantern is not lit yet</h2><p>The DM is still scheming. Pour yourself a drink. When the scene is set it appears here, and monsters flip onto the table when they arrive.</p></div>`;
  return sc+partyHTML()+(mons?`<div style="display:grid;gap:10px"><span class="eyebrow">In the fight</span><div class="mons">${mons}</div></div>`:'')+((P.log||[]).length?`<div class="panel"><h3>The story so far</h3><div class="log">${P.log.map(l=>`<div>${esc(l.text)}</div>`).join('')}</div></div>`:'');
}

function renderOverlay(){const o=$('#ov');const p=S.open&&S.players.find(p=>p.id===S.open);if(!p||!p.data){o.innerHTML='';return}
  o.innerHTML=`<div class="ov" data-act="closebg"><div class="card" role="dialog" aria-label="${esc(p.data.name)}"><div class="ovhead"><span class="eyebrow">Character sheet</span><button class="btn sm" data-act="close">Close</button></div>${S.art['pc-'+p.id]?`<div class="portrait" style="margin-bottom:12px">${artImg('pc-'+p.id)}</div>`:''}${sheetHTML(p.data,{by:p.label,secret:p.secret})}</div></div>`}

/* ---------- render ---------- */
function render(){
  $('#brand').firstChild.nodeValue=CFG.name||'The Guild of Second Chances';
  $('#role').innerHTML=LIVE?'':`<span class="sub">Demo:</span>${[['player','Player'],['dm','DM'],['table','Table screen']].map(([k,l])=>`<button class="chip ${(k==='dm'&&S.dmMode)||(k==='table'&&S.tableMode)||(k==='player'&&!S.dmMode&&!S.tableMode)?'on':''}" data-act="demo" data-v="${k}">${l}</button>`).join('')}`;
  let tabs=[];
  if(S.dmMode&&S.pass&&S.err!=='auth')tabs=[['players','Players'],['run','Run the table']];
  else if(!S.dmMode&&!S.tableMode&&S.me&&S.me.data&&!S.editing)tabs=[['me','My character'],['table','The table']];
  const cur=S.dmMode?S.dtab:S.ptab;
  $('#tabs').innerHTML=tabs.map(([k,l])=>`<button data-act="tab" data-t="${k}" aria-current="${cur===k}">${l}</button>`).join('');
  document.body.classList.toggle('tv',S.tableMode);
  const showMood=S.tableMode||(!S.dmMode&&S.me&&S.me.data&&!S.editing);
  setMood(showMood&&S.pub&&S.pub.scene?S.pub.scene.mood||'':'');
  const body=S.tableMode?viewTable():S.dmMode?(S.dtab==='run'&&S.pass&&S.err!=='auth'?viewRun():viewDM()):viewPlayer();
  $('#main').innerHTML='<section class="view">'+body+'</section>';
  renderOverlay();
}

const FX={kind:'',parts:[],raf:0,next:0};
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function setMood(m){if(FX.kind===m)return;FX.kind=m;document.body.dataset.mood=m;FX.parts=[];FX.next=performance.now()+3000;cancelAnimationFrame(FX.raf);const c=$('#fxc');const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);if(m&&!RM&&['rain','storm','snow','cellar','forest','tavern'].includes(m))FX.raf=requestAnimationFrame(fxTick)}
function fxSize(){const c=$('#fxc');const dpr=Math.min(2,window.devicePixelRatio||1);c.width=innerWidth*dpr;c.height=innerHeight*dpr;c.getContext('2d').setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',fxSize);fxSize();
function spawn(k,W,H,init){const r=Math.random;
  if(k==='rain'||k==='storm')return{x:r()*W*1.2,y:init?r()*H:-20,v:9+r()*6,l:10+r()*14};
  if(k==='snow')return{x:r()*W,y:init?r()*H:-10,v:.4+r()*.8,s:1+r()*2.4,p:r()*6};
  if(k==='cellar')return{x:r()*W,y:r()*H,vx:(r()-.5)*.15,vy:(r()-.5)*.1,s:.6+r()*1.4,a:.1+r()*.25};
  if(k==='forest')return{x:r()*W,y:H*.3+r()*H*.7,vx:(r()-.5)*.3,vy:(r()-.5)*.3,p:r()*6,s:1.5+r()*1.5};
  if(k==='tavern')return{x:W*.2+r()*W*.6,y:init?H-r()*H*.4:H+5,vy:.3+r()*.6,vx:(r()-.5)*.3,s:.8+r()*1.4,life:1};}
function fxTick(t){
  const k=FX.kind;if(!k)return;const c=$('#fxc'),x=c.getContext('2d'),W=innerWidth,H=innerHeight;
  if(document.hidden){FX.raf=requestAnimationFrame(fxTick);return}
  const want={rain:Math.min(140,W*H/9000),storm:Math.min(200,W*H/6000),snow:Math.min(110,W*H/12000),cellar:45,forest:28,tavern:26}[k]|0;
  while(FX.parts.length<want)FX.parts.push(spawn(k,W,H,true));
  x.clearRect(0,0,W,H);
  for(let i=0;i<FX.parts.length;i++){const q=FX.parts[i];
    if(k==='rain'||k==='storm'){q.y+=q.v;q.x-=q.v*.25;x.strokeStyle='rgba(180,200,235,.28)';x.lineWidth=1;x.beginPath();x.moveTo(q.x,q.y);x.lineTo(q.x+q.l*.25,q.y-q.l);x.stroke();if(q.y>H+20)FX.parts[i]=spawn(k,W,H)}
    else if(k==='snow'){q.y+=q.v;q.p+=.01;q.x+=Math.sin(q.p)*.4;x.fillStyle='rgba(235,240,250,.55)';x.beginPath();x.arc(q.x,q.y,q.s,0,7);x.fill();if(q.y>H+10)FX.parts[i]=spawn(k,W,H)}
    else if(k==='cellar'){q.x+=q.vx;q.y+=q.vy;if(q.x<0||q.x>W||q.y<0||q.y>H)FX.parts[i]=spawn(k,W,H);x.fillStyle='rgba(230,215,180,'+q.a+')';x.beginPath();x.arc(q.x,q.y,q.s,0,7);x.fill()}
    else if(k==='forest'){q.x+=q.vx+Math.sin(t/1500+q.p)*.2;q.y+=q.vy+Math.cos(t/1700+q.p)*.2;const a=.25+.55*Math.max(0,Math.sin(t/700+q.p));const g=x.createRadialGradient(q.x,q.y,0,q.x,q.y,q.s*5);g.addColorStop(0,'rgba(215,240,120,'+a+')');g.addColorStop(1,'rgba(215,240,120,0)');x.fillStyle=g;x.beginPath();x.arc(q.x,q.y,q.s*5,0,7);x.fill();if(q.x<-20||q.x>W+20||q.y<0||q.y>H+20)FX.parts[i]=spawn(k,W,H)}
    else if(k==='tavern'){q.y-=q.vy;q.x+=q.vx+Math.sin(t/600+i)*.15;q.life-=.0025;x.fillStyle='rgba(255,170,80,'+Math.max(0,q.life*.6)+')';x.beginPath();x.arc(q.x,q.y,q.s,0,7);x.fill();if(q.life<=0||q.y<H*.35)FX.parts[i]=spawn(k,W,H)}}
  if(k==='storm'&&t>FX.next){const f=document.querySelector('.fx-flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');FX.next=t+5000+Math.random()*9000}
  FX.raf=requestAnimationFrame(fxTick);
}
async function pollTable(force){

  try{const r=await API.tableGet();const pub=(r&&r.pub)||{};const sig=JSON.stringify(pub);let ch=false;if(sig!==S.pubSig){S.pubSig=sig;S.pub=pub;ch=true}const ids=(pub.monsters||[]).map(m=>m.art);if(S.me&&S.me.id)ids.push('pc-'+S.me.id);if(await syncArt(ids,false))ch=true;if(ch)render();S.artNew.clear()}catch(e){}
}

  case'reveal':{const id=b.dataset.id;const sh=!(S.artIdx[id]||{}).shown;try{await API.dmArtShow(S.pass,id,sh);S.artIdx[id]={...(S.artIdx[id]||{id}),shown:sh};toast(sh?'Revealed. It flips onto their phone within a few seconds.':'Hidden again.');rr()}catch(err){toast('Could not change that: '+esc(err.message))}break}
  case'prompt':{let txt='';if(b.dataset.mk){const m=S.dmt.monsters.find(x=>x.k===b.dataset.mk);if(m)txt=monPrompt(m)}else{const p=S.players.find(x=>String(x.id)===b.dataset.pid);if(p&&p.data)txt=pcPrompt(p.data)}if(!txt)break;
    try{await navigator.clipboard.writeText(txt);toast('Prompt copied. Paste it into your image generator'+(b.dataset.pid?' and fill in the likeness part.':'.'))}catch(err){toast(esc(txt),15000)}break}
  case'mrm':S.dmt.monsters=S.dmt.monsters.filter(x=>x.k!==b.dataset.k);saveDmt();break;
  case'mrevealall':S.dmt.monsters.forEach(m=>m.shown=true);saveDmt('Everything is on the table.');break;
  case'mcleardown':S.dmt.monsters=S.dmt.monsters.filter(m=>m.hp>0);saveDmt();break;
  }
});

/* ---------- boot ---------- */
(async()=>{
  render();
  if(S.tableMode){await pollTable(true);return}
  if(S.dmMode){if(S.pass)await dmLoad();return}
  if(!S.token){S.loaded=true;render();return}
  try{S.me=await API.me(S.token);if(S.me&&S.me.data&&!lsGet(draftKey(),null))S.draft=charToDraft(S.me.data,'')}catch(e){toast('Could not reach the table: '+esc(e.message))}
  S.loaded=true;render();
})();
})();
</script>
